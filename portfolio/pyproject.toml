[project]
name = "django-portfolio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django",
    "django-allauth",
    "python-dotenv",
    "Pillow",
    "dj-database-url",
    "psycopg[binary]",
    "requests",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput && python manage.py shell -c \"import os; from django.contrib.auth import get_user_model; User = get_user_model(); username = os.environ['DJANGO_SUPERUSER_USERNAME']; email = os.environ['DJANGO_SUPERUSER_EMAIL']; password = os.environ['DJANGO_SUPERUSER_PASSWORD']; u = User.objects.filter(username=username).first(); u = u or User(username=username, email=email, is_staff=True, is_superuser=True); u.email=email; u.is_staff=True; u.is_superuser=True; u.set_password(password); u.save()\""
